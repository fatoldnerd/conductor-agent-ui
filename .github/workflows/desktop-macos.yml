name: Desktop macOS Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'electron/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'vite.config.test.ts'
      - '.github/workflows/desktop-macos.yml'
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'vite.config.test.ts'
      - '.github/workflows/desktop-macos.yml'

jobs:
  build-macos:
    name: Build unsigned macOS desktop artifact
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Build unsigned macOS app
        run: npm run desktop:build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: conductor-macos-unsigned
          path: release/**
          if-no-files-found: error
